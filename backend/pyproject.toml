[project]
name = "xlent-compliance"
version = "0.1.0"
description = "AI-drevet compliance-tjeneste for norske eksportbedrifter"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "XLENT Norge AS" }]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",

    # Validering og konfigurasjon
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",

    # PDF-parsing via Docling.
    # Docling laster ned ML-modeller (~1-2 GB) ved første kjøring.
    # Standard pipeline bruker TableFormer og EasyOCR — ingen API-nøkkel.
    # Multimodal pipeline bruker OpenAI vision-API — krever OPENAI_API_KEY i .secrets.
    "docling>=2.15.0",

    # LLM-klienter
    "anthropic>=0.39.0",
    "openai>=1.55.0",   # brukes også for Ollama via OpenAI-kompatibelt API

    # HTTP-klient for Ollama-integrasjon
    "httpx>=0.28.0",

    # Køhåndtering
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Logging og observability
    "structlog>=24.4.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Diverse
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "faker>=33.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "ASYNC", "S", "RUF",
]
ignore = [
    "S101",  # tillat assert i tester
    "B008",  # FastAPI Depends() er trygt i defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["docling.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tester som krever ekte database og eksterne tjenester",
    "slow: langsomme tester (laster Docling-modeller)",
]
