[project]
name = "xlent-compliance"
version = "0.1.0"
description = "AI-drevet compliance-tjeneste for norske eksportbedrifter"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "XLENT Norge AS" }]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",

    # Validering og konfigurasjon
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",

    # PDF-parsing via Docling.
    # Docling laster ned ML-modeller (~1-2 GB) ved første kjøring.
    # Standard pipeline bruker TableFormer og EasyOCR — ingen API-nøkkel.
    # Multimodal pipeline bruker OpenAI vision-API — krever OPENAI_API_KEY i .secrets.
    "docling>=2.15.0",

    # LLM-klienter
    "anthropic>=0.39.0",
    "openai>=1.55.0",   # brukes også for Ollama via OpenAI-kompatibelt API

    # HTTP-klient for Ollama-integrasjon
    "httpx>=0.28.0",

    # Køhåndtering
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # Logging og observability
    "structlog>=24.4.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Diverse
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "faker>=33.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "ASYNC", "S", "RUF",
]
ignore = [
    "S101",    # tillat assert i tester
    "B008",    # FastAPI Depends() er trygt i defaults
    "RUF001",  # tilsiktede Unicode-tegn (–, ×) i norske strenger
    "RUF002",  # tilsiktede Unicode-tegn i docstrings
    "RUF003",  # tilsiktede Unicode-tegn i kommentarer
    "ASYNC109", # timeout-parameter i async-funksjoner er tilsiktet
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/**/*.py" = ["E501"]
"app/api/v1/report.py" = ["E501"]
"app/api/v1/vendors.py" = ["E501"]
"app/services/hs_code_service.py" = ["E501"]
"app/services/kri_service.py" = ["E501"]
"app/services/screening_service.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["docling.*", "celery.*"]
ignore_missing_imports = true

# Pre-eksisterende filer som ikke er oppdatert til mypy strict — ignoreres inntil
# vi tar en dedikert type-runde. Nye filer skal overholde strict-modus.
[[tool.mypy.overrides]]
module = [
    "app.api.v1.agreements",
    "app.api.v1.ai_governance",
    "app.api.v1.catch_all",
    "app.api.v1.config",
    "app.api.v1.export_control",
    "app.api.v1.invoices",
    "app.api.v1.kri",
    "app.api.v1.models",
    "app.api.v1.report",
    "app.api.v1.rules",
    "app.api.v1.sanctions",
    "app.core.logging",
    "app.llm.claude",
    "app.llm.factory",
    "app.llm.openai_client",
    "app.llm.prompts",
    "app.main",
    "app.models.agreement",
    "app.models.ai_decision_record",
    "app.models.audit_log",
    "app.models.compliance_policy",
    "app.models.extended_screen_claim",
    "app.models.extended_screen_source",
    "app.models.extended_screening",
    "app.models.external_watchlist_entry",
    "app.models.invoice_pipeline_event",
    "app.models.invoice",
    "app.models.notification",
    "app.models.rule",
    "app.models.screening",
    "app.models.user_preference",
    "app.parsers.docling_parser",
    "app.sanctions.embargo",
    "app.sanctions.yente_client",
    "app.schemas.audit_plan",
    "app.schemas.invoice",
    "app.schemas.screening",
    "app.services.agreement_service",
    "app.services.ai_governance_service",
    "app.services.catch_all_service",
    "app.services.export_control_service",
    "app.services.extended_screening_service",
    "app.services.invoice_preferences_service",
    "app.services.invoice_service",
    "app.services.kri_service",
    "app.services.pipeline_ops_service",
    "app.services.policy_service",
    "app.services.regulatory_radar_service",
    "app.services.rule_engine_service",
    "app.services.sanctions_refresh_service",
    "app.services.screening_service",
    "app.services.shipment_map_service",
    "app.tasks.celery_app",
    "app.tasks.extended_screen",
    "app.tasks.extract_invoice",
    "app.tasks.process_invoice",
    "app.tasks.screen_entities",
    "app.tasks.screening_watchdog",
    "app.tasks.update_embargo_list",
    "app.tasks.update_export_lists",
    "app.tasks.update_external_watchlists",
    "app.tasks.update_sanctions",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tester som krever ekte database og eksterne tjenester",
    "slow: langsomme tester (laster Docling-modeller)",
]
